name: Daily agency scrape

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: [remax, propertymarket, zanzi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper
        run: pip install -r scraper/requirements.txt
      - name: Scrape ${{ matrix.source }}
        working-directory: scraper
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPE_DELAY_SECONDS: "0.1"
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            export SCRAPE_FULL=1
          fi
          python -m mtprop agencies --source ${{ matrix.source }}

  revalidate:
    needs: scrape
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Revalidate app cache
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$REVALIDATE_URL" ] && [ -n "$REVALIDATE_SECRET" ]; then
            curl -sf -X POST "$REVALIDATE_URL/api/revalidate" \
              -H "x-revalidate-secret: $REVALIDATE_SECRET"
          fi

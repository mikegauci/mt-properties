name: Daily agency scrape

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper
        run: pip install -r scraper/requirements.txt
      - name: Scrape agencies
        working-directory: scraper
        env:
          PYTHONPATH: .
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          SCRAPE_DELAY_SECONDS: "0.5"
        run: |
          if [ "$(date -u +%u)" = "7" ]; then
            export SCRAPE_FULL=1
          fi
          python -m mtprop agencies
      - name: Revalidate app cache
        if: success()
        env:
          REVALIDATE_URL: ${{ secrets.REVALIDATE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -n "$REVALIDATE_URL" ] && [ -n "$REVALIDATE_SECRET" ]; then
            curl -sf -X POST "$REVALIDATE_URL/api/revalidate" \
              -H "x-revalidate-secret: $REVALIDATE_SECRET"
          fi
